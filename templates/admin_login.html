{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<h1>🔐 Admin Login</h1>

<form method="POST">

    <p>
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
    </p>

    <p>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
    </p>

    <button type="submit">
        Login
    </button>

</form>

<br>

<a href="{{ url_for('admin_register') }}">
    Create Admin Account
</a>

{% endblock %}
