{% extends "base.html" %}

{% block title %}
Admin Registration
{% endblock %}

{% block content %}

<h1>🔐 Create Admin Account</h1>

<form method="POST">

    <p>
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
    </p>

    <p>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
    </p>

    <button type="submit">
        Create Admin
    </button>

</form>

<br>

<a href="{{ url_for('admin_login') }}">
    Already have an account? Login
</a>

{% endblock %}
