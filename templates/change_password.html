{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="password-container">

    <div class="password-card">

        <h1>🔐 Change Password</h1>

        <p>
            Update your MediaHub account password.
        </p>

        {% if error %}

            <div class="password-error">
                {{ error }}
            </div>

        {% endif %}

        {% if success %}

            <div class="password-success">
                {{ success }}
            </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('change_password') }}"
        >

            <label>
                Current Password
            </label>

            <input
                type="password"
                name="current_password"
                placeholder="Enter current password"
                required
            >

            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

        <div class="password-back">

            <a href="{{ url_for('profile') }}">
                ← Back to Profile
            </a>

        </div>

    </div>

</div>

{% endblock %}
