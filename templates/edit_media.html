{% extends "base.html" %}

{% block title %}
Edit Media
{% endblock %}

{% block content %}

<h1>✏️ Edit Media</h1>

<form
    method="POST"
>

    <label>
        Title
    </label>

    <br>

    <input
        type="text"
        name="title"
        value="{{ media['title'] }}"
        required
    >

    <br><br>


    <label>
        Description
    </label>

    <br>

    <textarea
        name="description"
        rows="5"
    >{{ media['description'] }}</textarea>

    <br><br>


    <label>
        Category
    </label>

    <br>

    <input
        type="text"
        name="category"
        value="{{ media['category'] }}"
    >

    <br><br>


    <button type="submit">
        💾 Save Changes
    </button>

</form>

<br>

<a href="{{ url_for('admin_dashboard') }}">
    ← Back to Dashboard
</a>

{% endblock %}
