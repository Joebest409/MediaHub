{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-icon">
            ✏️
        </div>

        <h1>
            Edit Profile
        </h1>

        <p class="auth-subtitle">
            Update your MediaHub account information.
        </p>


        <form
            method="POST"
            class="auth-form"
        >

            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ user['username'] }}"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user['email'] }}"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Leave blank to keep current password"
                    minlength="6"
                    autocomplete="new-password"
                >

                <small class="form-help">
                    Leave blank if you don't want to change your password.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="auth-btn"
            >
                💾 Save Changes
            </button>

        </form>


        <div class="auth-divider">
            <span>Account Settings</span>
        </div>


        <a
            href="{{ url_for('profile') }}"
            class="login-link"
        >
            ← Back to Profile
        </a>

    </div>

</div>

{% endblock %}
