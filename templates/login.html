{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <h1>
        🔐 Login
    </h1>

    <form
        method="POST"
        class="auth-form"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
            autocomplete="username"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        >


        <button
            type="submit"
            class="auth-btn"
        >
            Login
        </button>
        
        
        <div class="forgot-password-link">

    <a href="{{ url_for('forgot_password') }}">
        Forgot your password?
    </a>

</div>

    </form>


    <p class="auth-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>

</div>

{% endblock %}
