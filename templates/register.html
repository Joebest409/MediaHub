{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Join MediaHub and enjoy your favorite media.
        </p>

        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            <span>Already a member?</span>
        </div>


        <a
            href="{{ url_for('login') }}"
            class="login-link"
        >
            Login to your account
        </a>

    </div>

</div>

{% endblock %}
